<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ベース（角丸ダーク背景） -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- 左側ファイルカード -->
  <g filter="url(#shadow)">
    <rect x="72" y="96" width="168" height="320" rx="16" fill="#FFFFFF"/>
    <path d="M 72 112 A 16 16 0 0 1 88 96 L 224 96 A 16 16 0 0 1 240 112 L 240 136 L 72 136 Z" fill="#E2E8F0"/>
    <circle cx="92" cy="116" r="5" fill="#EF4444"/>
    <circle cx="108" cy="116" r="5" fill="#F59E0B"/>
    <circle cx="124" cy="116" r="5" fill="#10B981"/>

    <rect x="92" y="160" width="80" height="10" rx="5" fill="#94A3B8"/>
    <rect x="92" y="184" width="120" height="10" rx="5" fill="#94A3B8"/>
    
    <!-- 差分ハイライト（黄色） -->
    <rect x="84" y="208" width="144" height="28" rx="6" fill="#FEF3C7"/>
    <rect x="92" y="217" width="100" height="10" rx="5" fill="#D97706"/>

    <rect x="92" y="252" width="110" height="10" rx="5" fill="#94A3B8"/>

    <!-- 一致ハイライト（緑色） -->
    <rect x="84" y="276" width="144" height="28" rx="6" fill="#DCFCE7"/>
    <rect x="92" y="285" width="116" height="10" rx="5" fill="#16A34A"/>

    <rect x="92" y="320" width="90" height="10" rx="5" fill="#94A3B8"/>
    <rect x="92" y="344" width="130" height="10" rx="5" fill="#94A3B8"/>
  </g>

  <!-- 右側ファイルカード -->
  <g filter="url(#shadow)">
    <rect x="272" y="96" width="168" height="320" rx="16" fill="#FFFFFF"/>
    <path d="M 272 112 A 16 16 0 0 1 288 96 L 424 96 A 16 16 0 0 1 440 112 L 440 136 L 272 136 Z" fill="#E2E8F0"/>
    <circle cx="292" cy="116" r="5" fill="#EF4444"/>
    <circle cx="308" cy="116" r="5" fill="#F59E0B"/>
    <circle cx="324" cy="116" r="5" fill="#10B981"/>

    <rect x="292" y="160" width="80" height="10" rx="5" fill="#94A3B8"/>
    <rect x="292" y="184" width="120" height="10" rx="5" fill="#94A3B8"/>
    
    <!-- 差分ハイライト（黄色） -->
    <rect x="284" y="208" width="144" height="28" rx="6" fill="#FEF3C7"/>
    <rect x="292" y="217" width="124" height="10" rx="5" fill="#D97706"/>

    <rect x="292" y="252" width="110" height="10" rx="5" fill="#94A3B8"/>

    <!-- 一致ハイライト（緑色） -->
    <rect x="284" y="276" width="144" height="28" rx="6" fill="#DCFCE7"/>
    <rect x="292" y="285" width="116" height="10" rx="5" fill="#16A34A"/>

    <rect x="292" y="320" width="90" height="10" rx="5" fill="#94A3B8"/>
    <rect x="292" y="344" width="70" height="10" rx="5" fill="#94A3B8"/>
  </g>

  <!-- 中央マージシンボル -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="222" r="28" fill="#2563EB"/>
    <path d="M 244 222 L 252 214 M 244 222 L 252 230 M 244 222 L 268 222 M 268 222 L 260 214 M 268 222 L 260 230" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
